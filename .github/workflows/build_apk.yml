name: Build NoDPI v2.3 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare project files via Python (safe from YAML indentation issues)
        run: |
          python3 -c '
          import os, shutil

          # 1. Проверяем имя main.py
          for alt in ["main_py.txt", "main.py.txt"]:
              if os.path.exists(alt) and not os.path.exists("main.py"):
                  shutil.move(alt, "main.py")

          # 2. Создаем Java-сервис VPN
          java_dir = "java_src/org/gvcoder/nodpi"
          os.makedirs(java_dir, exist_ok=True)

          java_code = """package org.gvcoder.nodpi;

          import android.content.Intent;
          import android.net.ProxyInfo;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;

          public class NoDpiVpnService extends VpnService {
              private ParcelFileDescriptor vpnInterface = null;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "STOP".equals(intent.getAction())) {
                      stopVpn();
                      return START_NOT_STICKY;
                  }
                  String host = "127.0.0.1";
                  int port = 8881;
                  if (intent != null) {
                      if (intent.hasExtra("HOST")) host = intent.getStringExtra("HOST");
                      if (intent.hasExtra("PORT")) port = intent.getIntExtra("PORT", 8881);
                  }
                  startVpn(host, port);
                  return START_STICKY;
              }

              private void startVpn(String host, int port) {
                  if (vpnInterface != null) return;
                  try {
                      Builder builder = new Builder();
                      builder.setSession("NoDPI v2.3 LTE Mode")
                             .setMtu(1500)
                             .addAddress("10.111.222.1", 32);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          builder.setHttpProxy(ProxyInfo.buildDirectProxy(host, port));
                      }

                      try {
                          builder.addDisallowedApplication(getPackageName());
                      } catch (Exception ignored) {}

                      vpnInterface = builder.establish();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void stopVpn() {
                  try {
                      if (vpnInterface != null) {
                          vpnInterface.close();
                          vpnInterface = null;
                      }
                  } catch (Exception ignored) {}
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  stopVpn();
                  super.onDestroy();
              }
          }
          """
          with open(os.path.join(java_dir, "NoDpiVpnService.java"), "w") as f:
              f.write(java_code)

          # 3. Создаем manifest_extra.xml
          manifest_xml = """<service android:name="org.gvcoder.nodpi.NoDpiVpnService"
                   android:permission="android.permission.BIND_VPN_SERVICE"
                   android:exported="false">
              <intent-filter>
                  <action android:name="android.net.VpnService"/>
              </intent-filter>
          </service>"""
          manifest_path = os.path.abspath("manifest_extra.xml")
          with open(manifest_path, "w") as f:
              f.write(manifest_xml)

          # 4. Создаем buildozer.spec
          spec = f"""[app]
          title = NoDPI v2.3
          package.name = nodpi
          package.domain = org.gvcoder
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt,xml
          version = 2.3.1
          requirements = python3,kivy==2.3.0,pyjnius
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,ACCESS_NETWORK_STATE,FOREGROUND_SERVICE
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          android.add_src = java_src
          android.extra_manifest_application_arguments = {manifest_path}
          p4a.branch = master

          [buildozer]
          log_level = 2
          warn_on_root = 0
          """
          with open("buildozer.spec", "w") as f:
              f.write("\n".join(line.strip() for line in spec.splitlines()))
          '

      - name: Install system dependencies and Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake autopoint gettext libltdl-dev
          pip install --upgrade pip "setuptools<69.0.0" wheel virtualenv
          pip install "cython==0.29.36" git+https://github.com/kivy/buildozer.git@master

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoDPI-v2.3-LTE-APK
          path: bin/*.apk
